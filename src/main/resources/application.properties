spring.application.name=chatloop
spring.main.web-application-type=none

spring.ai.vectorstore.qdrant.initialize-schema=true

# Spring Boot's docker-compose support skips starting compose.yaml's services
# during tests by default, so contextLoads() would otherwise fail to reach
# Ollama/Qdrant. The "app" service in compose.yaml has its own profile and is
# never started by this auto-management, so this only brings up qdrant+ollama.
spring.docker.compose.skip.in-tests=false

# Local Ollama models (served by the "ollama" service in compose.yaml) -
# no API key or billing required. Models are pulled automatically on first
# run if missing.
# Chosen for speed, not accuracy: this answers in seconds rather than minutes,
# at the cost of inventing refund verdicts - see docs/probe-questions.md.
# llama3.1:8b is the accurate (but minutes-per-answer) alternative.
spring.ai.ollama.chat.model=llama3.2:3b
spring.ai.ollama.embedding.model=nomic-embed-text
spring.ai.ollama.init.pull-model-strategy=when_missing

# The llama3.1:8b download is ~4.9GB (it took ~12 minutes at 6.7MB/s on the
# connection this was developed on); Spring AI's default 5-minute pull timeout
# (with 0 retries) is far too short, failing app startup with
# "Retries exhausted: 0/0" even though the pull was still in progress.
spring.ai.ollama.init.timeout=20m
spring.ai.ollama.init.max-retries=1

# Replace this path with the path to a document of your choice, e.g.
# file:///home/you/Documents/mydoc.pdf
rag.document.url=classpath:refunds.md
#rag.document.url=classpath:DDD.pdf

# Tracing. One trace per Turn: the chatloop.turn observation in SpringRagApplication is the
# root, and Spring AI's own observations - the ChatClient call, each advisor, the embedding,
# the Qdrant query - nest underneath it. Traces go to the "tempo" service in compose.yaml and
# are read in Grafana at http://localhost:3000.
#
# This endpoint is right for running on the host (./gradlew bootRun) against compose-managed
# services. Spring Boot 4.1 has no docker-compose service connection for OTLP, so nothing
# rewrites it: the containerised "app" service overrides it to http://tempo:4318 by
# environment variable. Without that override the container would export to its own loopback
# and fail silently.
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces

# Trace every Turn; the default is 0.1. Fine for a demo you run by hand, not a production
# setting.
management.tracing.sampling.probability=1.0

# Spring AI's content observations. These write to a logger rather than onto spans - each
# handler holds a commons-logging Log and emits at INFO - so the prompt, the completion and
# the retrieved chunks land in the console, tied to their trace by the traceId Spring Boot
# stamps into every log line. They are off by default upstream for a good reason: in a real
# system this is customer data walking into your logs. Here the customer is you and the
# corpus is refunds.md.
#
# These are the chat *model* level flags, i.e. the prompt as actually sent to Ollama, with the
# system prompt, the chat memory and the policy chunks QuestionAnswerAdvisor spliced in. The
# spring.ai.chat.client.observations.* equivalents log it *before* that augmentation, which is
# the wrong text for working out why a refund verdict was invented.
spring.ai.chat.observations.log-prompt=true
spring.ai.chat.observations.log-completion=true
spring.ai.vectorstore.observations.log-query-response=true

# spring-boot-starter-opentelemetry brings micrometer-registry-otlp with it, which defaults to
# pushing metrics to localhost:4318/v1/metrics every minute - the same port Tempo listens on,
# which accepts traces and nothing else. The chatloop.turn and chatloop.ingest timers are still
# produced, they just have no backend to go to: there is deliberately no Prometheus here (see
# docs/adr/0002). Left enabled this is a failed push a minute, for nothing.
management.otlp.metrics.export.enabled=false
