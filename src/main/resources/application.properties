spring.application.name=chatloop
spring.main.web-application-type=none

spring.ai.vectorstore.qdrant.initialize-schema=true

# Spring Boot's docker-compose support skips starting compose.yaml's services
# during tests by default, so contextLoads() would otherwise fail to reach
# Ollama/Qdrant. The "app" service in compose.yaml has its own profile and is
# never started by this auto-management, so this only brings up qdrant+ollama.
spring.docker.compose.skip.in-tests=false

# Local Ollama models (served by the "ollama" service in compose.yaml) -
# no API key or billing required. Models are pulled automatically on first
# run if missing.
spring.ai.ollama.chat.model=llama3.2:3b
spring.ai.ollama.embedding.model=nomic-embed-text
spring.ai.ollama.init.pull-model-strategy=when_missing

# Replace this path with the path to a document of your choice, e.g.
# file:///home/you/Documents/mydoc.pdf
rag.document.url=classpath:sample-document.txt
#rag.document.url=classpath:DDD.pdf
